name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized package version
        required: true
        type: string
      publish:
        description: Publish retained tarballs to npm (requires protected environment)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: motionforge-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate requested version and publication ref
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync("packages/schema/package.json","utf8")).version;if(v!==process.env.RELEASE_VERSION)throw new Error(`requested ${process.env.RELEASE_VERSION}, packages are ${v}`)'
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/tags/v$RELEASE_VERSION" ]; then
            echo "Publishing requires dispatching the exact v$RELEASE_VERSION tag ref." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionforge/golden exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:full
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/pack-release.mjs artifacts/release
      - name: Verify retained release bytes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/publish-release.mjs artifacts/release --verify-only
          node scripts/verify-clean-machine.mjs --pack-dir artifacts/release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionforge-${{ inputs.version }}-candidate
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish }}
    needs: candidate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: motionforge-${{ inputs.version }}-candidate
          path: artifacts/release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the exact tested tarballs
        env:
          # Needed only for the one-time scoped-package bootstrap. Revoke it
          # after configuring npm trusted publishers; later runs use OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/publish-release.mjs artifacts/release "v$RELEASE_VERSION"
      - name: Attach durable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "MotionForge ${{ inputs.version }}" \
              --notes "Verified synchronized MotionForge ${{ inputs.version }} release artifacts."
          gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
